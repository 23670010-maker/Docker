services:

  redis:
    image: redis:8-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"
    volumes:
      - ./angular/dist/browser:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - flask1
      - flask2
      - flask3

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  flask1:

    build: ./flask

    volumes:
      - ./flask:/app

    environment:

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}

      DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}

      REDIS_PORT: ${REDIS_PORT}

      DB_HOST: ${DB_HOST}

      DB_PORT: ${DB_PORT}

      DB_NAME: ${MYSQL_DATABASE}

      DB_USER: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      APP_INSTANCE: flask1

    depends_on:
      - mysql
      - redis


  flask2:

    build: ./flask

    volumes:
      - ./flask:/app

    environment:

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}

      DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}

      REDIS_PORT: ${REDIS_PORT}

      DB_HOST: ${DB_HOST}

      DB_PORT: ${DB_PORT}

      DB_NAME: ${MYSQL_DATABASE}

      DB_USER: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      APP_INSTANCE: flask2

    depends_on:
      - mysql

      - redis


  flask3:

    build: ./flask

    volumes:
      - ./flask:/app

    environment:

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}

      DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}

      REDIS_PORT: ${REDIS_PORT}

      DB_HOST: ${DB_HOST}

      DB_PORT: ${DB_PORT}

      DB_NAME: ${MYSQL_DATABASE}

      DB_USER: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      APP_INSTANCE: flask3

    depends_on:
      - mysql
      - redis




  angular:
    image: node:24.15-bookworm
    working_dir: /app/minierp-angular
    ports:
      - "4200:4200"
    volumes:
      - ./angular:/app
      - angular_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -d node_modules ]; then npm install; fi
      && npx ng serve --host 0.0.0.0 --port 4200"

volumes:
  mysql_data:
  angular_node_modules:
